name: fish-speech-jetson

services:
  server:
    image: fish-speech-jetson:orin
    build:
      context: .
      dockerfile: docker/Dockerfile.jetson
      target: runtime
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-http://wa.lan:10608/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
        MODEL_DIR: ${MODEL_DIR:-checkpoints/openaudio-s1-mini}
        PRECOMPILE: ${PRECOMPILE:-1}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_SERVER_NAME: 0.0.0.0
      API_SERVER_PORT: 8080
      COMPILE: ${COMPILE:-auto}
      TORCHINDUCTOR_CACHE_DIR: /opt/torch-compile-cache
      TRITON_CACHE_DIR: /opt/triton-cache
    volumes:
      - ./references:/app/references
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
